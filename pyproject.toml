[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forwardstate"
version = "0.1.0"
description = "Event-driven investment decision support: scenario forecasts, portfolio risk and explainable alerts. No trade execution."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=1.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.scripts]
forwardstate = "forwardstate.cli:main"

[project.optional-dependencies]
optimize = ["cvxpy>=1.4"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/forwardstate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
